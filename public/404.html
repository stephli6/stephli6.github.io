<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script>
      // Single-page-app fallback for GitHub Pages: a direct visit to
      // /projects or /skills has no server route, so GitHub serves this
      // file. Save the requested URL, go home, and index.html restores it
      // with history.replaceState before React mounts.
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
  </head>
  <body></body>
</html>
